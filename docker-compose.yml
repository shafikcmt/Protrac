services:
  db_v2:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend_v2:
    build:
      context: ./backend
    image: protrac-backend:v2
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8080 --workers 3 core.wsgi:application"
    volumes:
      - static_volume_v2:/app/staticfiles
    env_file:
      - ./backend/.env
    expose:
      - "8080"
    depends_on:
      db_v2:
        condition: service_healthy
    restart: unless-stopped

  frontend_v2:
    build:
      context: ./frontend
    image: protrac-frontend:v2
    expose:
      - "3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend_v2
    restart: unless-stopped

  nginx_v2:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume_v2:/staticfiles:ro
    ports:
      - "3000:80"
      - "8000:8080"
    depends_on:
      - backend_v2
      - frontend_v2
    restart: unless-stopped

volumes:
  postgres_data_v2:
  static_volume_v2:

networks:
  default:
    name: protrac_v2_network